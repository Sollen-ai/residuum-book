        words: 500
      - id: s5.5
        title: Multiple Conclusions and Multiple Derivations
        model: Haskell 5.5 (Returning Multiple Results)
        purpose: What if a rule fires many times, or an event has many proofs?
        covers: [one rule, many instances; one event, many justifications; provenance records; proof costs as library functions]
        excludes: [proof-cost algorithms (Appendix or s6.5 note)]

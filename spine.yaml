# Spine of "The Residuum Programming Language".
#
# This file is both the table of contents and the writing brief. An agent
# writing a section must read: the rules below, its own section entry, and
# the `owners` map, and nothing else decides its scope.
#
# Structure: the Haskell chapter's eight parts (~/tableOfContentsHaskell.txt),
# because Residuum, like Haskell and unlike Catala, is a general-purpose
# language; plus the series' two Part 1 additions (source-to-execution
# walkthrough and the criteria list, from ~/hanskellsen_docs/books/
# programming-language and ~/toccatala.txt); plus the explicit semantic
# labels of the revised Catala Part 3 (~/toccatala.txt) inside Part 6.
#
# Each section has:
#   model     where its shape comes from (chapter, section)
#   purpose   the one question the section answers
#   covers    what it must contain
#   excludes  what it must not contain, and which section owns that instead
#   evidence  what the section is written from; claims outside it need a
#             citation. Each entry is one of:
#               <path>                 file or directory in the residuum repo
#                                      at pinned_commit; globs allowed
#               <path> (<anchor>)      a heading or symbol inside that file,
#                                      spelled as in the file
#               <path>#L<a>-L<b>       a line range inside that file
#               git:log | git:tag <t>  the repo's history or a tag
#               series:<path>          a file outside the residuum repo
#               sec:<id>[..<id>]       other sections of this book
#               listing:self           the section's own listing
#               diagrams:<entry>       any repo form above, resolved in the
#                                      residuum-diagrams repo at
#                                      book.diagrams.commit (read-only)
#   listings  runnable examples it must include (kind: run | query | explain |
#             execute | expect-error | include); output is generated, never typed
#   words     target length
# Part 2 sections also have `verdict: required`.

book:
  title: El lenguaje de programación Residuum
  language: es           # decided 2026-11-19; readability: Fernández-Huerta
  repository: residuum   # the language repo the evidence paths refer to
  pinned_commit: d4d2282 # every evidence path and listing is read and run at
                         # this commit (main, 2026-11-19, language reference)
  diagrams:              # second read-only source of facts (owner, 2026-11-19):
    path: ~/residuum-diagrams   # its own study of Residuum's order structures,
    commit: ac4727f             # computed at residuum f3c8df3 (an ancestor of
                                # pinned_commit); cited as `diagrams:<path>`
  authors:               # title page, colophon and PDF metadata (owner, 2026-11-19)
    - Jesús Antonio Sesma Espinoza
    - Claude (Anthropic)
  edition: es-1.0        # release tag es-1.0-residuum-<pinned_commit> (owner, 2026-11-20)
  license: CC BY 4.0     # the book's text (owner, 2026-11-20); build/ is MIT
  license_url: https://creativecommons.org/licenses/by/4.0/deed.es
  source: https://github.com/Sollen-ai/residuum-book

# Unnumbered front matter, after the title page and colophon and before the
# table of contents. Added 2026-11-19 after an external review asked for the
# central contribution to be identifiable at the start.
front_matter:
  - id: preface
    title: Prefacio
    model: Catala Language Design (preface - audience and scope)
    purpose: ¿Para quién es este libro, qué cubre y cuál es la aportación central de Residuum?
    covers:
      - "Público: lectores con formación en lenguajes de programación o lógica; qué se supone y qué no."
      - "Alcance: qué cubre el libro (Residuum en el commit fijado) y qué deja fuera."
      - "La aportación central en una página: el problema (qué falta para llegar a un objetivo), el mecanismo (la consulta residual certificada por replay), su garantía (suficiencia, no completitud) y sus límites; cada punto con referencia a la sección que lo desarrolla."
      - "Cómo leer el libro: el orden de la serie (criterios antes de la teoría) y dos recorridos posibles, el de referencia y el guiado que empieza en @sec:s1.7."
      - "Convenciones: las clases de afirmación del repositorio, los listados ejecutados por el build y el apéndice de explicaciones."
    excludes:
      - "El desarrollo técnico de la residuación (s6.8): aquí sólo la síntesis y la referencia; esta sección está exenta de la regla de dos oraciones para ese concepto, sólo en la síntesis."
      - "Historia del proyecto (s1.2)."
    evidence: [docs/program-residual-query.md, docs/monotonic-core-audit.md, docs/active-residual-api.md, README.md, "sec:s6.8", "sec:s2.1..s2.12"]
    listings: []
    words: 900


rules:
  - Write only from the evidence listed for the section, the language
    reference (docs/language-reference.md) and the cited literature. Never
    describe a feature, flag or behaviour that the pinned commit does not have.
  - Every listing is a complete .res module or an include from the repo, and
    its output is produced by the build. Never paste or invent output.
  - Stay inside `covers`. When a topic belongs to another section (see
    `owners`), give at most two sentences and a cross-reference (@sec:id).
  - Classify claims the way the repo does - THEOREM, MODEL RESULT,
    EXPERIMENTAL OBSERVATION, IMPLEMENTED + TESTED, IMPLEMENTED + LIMITED, NOT IMPLEMENTED - when the
    evidence doc does.
  - State limitations plainly; do not promise future work beyond what a doc
    marks as pending.
  - Use the series' terms (expressivity, well-definedness, ...) and Residuum's
    own terms (Known, closure, residual requirement, seeds, premises, Program,
    RuleUse, default, effect, FOUR least model) consistently; define each once,
    in its owner section.
  - Each listing has a caption and an explanation; the build moves the
    explanation to the appendix "Listings explained".
  - Paragraphs over 100 words, sentences over 38 words and comma runs of 4+
    items fail the plain-language check (hanskellsen_docs lineamientos).

# Concept -> owning section. Everyone else refers, briefly.
owners:
  pipeline_overview: s1.4
  formal_grammar: s3.2
  parsing: s3.4
  type_system: s4.1
  subtyping: s4.3
  time_and_after: s4.4
  rules_as_abstraction: s5.1
  beta_reduction_substitution: s5.2
  forward_vs_goal_directed: s5.3
  partial_application: s5.7
  programs: s5.6
  monotonic_closure_meaning: s6.3
  semi_naive_evaluation: s6.5
  incremental_and_stepwise: s6.6
  monotonic_core_laws: s6.7
  residuation_and_abduction: s6.8
  requirement_denotation: s6.14
  program_order: s6.14
  hypergraph_reading: s6.14
  defaults: s6.9
  four_entailment: s6.10
  termination_and_limits: s6.11
  effects_and_state: s7.4
  resource_limits_runner: s7.2
  performance_measurements: s7.6
  legal_modeling: s8.2

parts:
  - id: p1
    title: Introducción y antecedentes
    sections:
      - id: s1.1
        title: El paradigma de la programación lógica
        model: Haskell 1.1 (The Functional Programming Paradigm)
        purpose: ¿Qué clase de lenguaje es Residuum?
        covers:
          - Lenguajes declarativos de reglas; cláusulas de Horn; derivación hacia delante de consecuencias.
          - La combinación propia de Residuum - eventos tipados con tiempos, reglas monotónicas, residuación (lo que todavía falta) y una capa separada de defaults no monotónica.
          - La descripción, en un párrafo, de lo que es un programa Residuum (declaraciones + reglas + experimentos).
        excludes:
          - Historia (s1.2); principios de diseño (s1.3); comparaciones con Prolog/Datalog/Catala (s1.5).
        evidence: [README.md, docs/v1-scope.md, docs/monotonic-core-specification.md]
        listings: [{kind: run, what: "el programa más pequeño con un seed, una regla y un evento derivado"}]
        words: 700

      - id: s1.2
        title: Origen y desarrollo de Residuum
        model: HAnSKELLsen PL 1.2; Haskell 1.2
        purpose: ¿De dónde viene Residuum y cómo llegó a su forma actual?
        covers:
          - El nombre (residuación) y el problema para el que se construyó.
          - Hitos del repositorio - la etiqueta congelada v1, el caso jurídico monotónico, las consultas residuales, los Programs, los defaults, la comparación FOUR, las optimizaciones de 2026-11 - con fechas del historial de git.
          - El frontend CNL pausado y por qué el pipeline activo es Formal.
        excludes:
          - El detalle técnico de cualquier hito (corresponde a las Partes 3-7).
        evidence: ["git:log", "git:tag v1", docs/v1-scope.md, docs/legal-monotonic-v1.md, docs/post-v1-integration-review.md, docs/worktree-integration-20261014.md]
        listings: []
        words: 800

      - id: s1.3
        title: La filosofía de diseño de Residuum
        model: Haskell 1.3
        purpose: ¿Qué principios deciden lo que Residuum hace y lo que se niega a hacer?
        covers:
          - Núcleo monotónico; la capa de consultas nunca amplía el cierre Horn.
          - Carácter explícito - los ámbitos y los bindings se declaran, sin grounding silencioso ni enumeración existencial.
          - Certificación - cada explicación residual pasa por un replay a través de los productores originales.
          - Clasificación honesta de los resultados (THEOREM vs MODEL RESULT vs OBSERVATION).
          - La ejecución acotada como restricción de diseño.
        excludes:
          - Los mecanismos mismos (Partes 5-6); los límites del runner en detalle (s7.2).
        evidence: [docs/monotonic-core-specification.md, docs/monotonic-core-laws.md, docs/residual-explicit-bindings-api.md, docs/legal-ontology-explicit-query-substitutions.md, AGENTS.md]
        listings: []
        words: 900

      - id: s1.4
        title: Del código fuente a la ejecución en la máquina
        model: HAnSKELLsen PL 1.3; Catala 1.3
        purpose: ¿Qué le ocurre a un fichero .res entre la línea de órdenes y la respuesta?
        covers:
          - Las etapas texto Formal -> SurfaceAST -> TypedAST -> derivación/runtime, con los nombres de módulo y de función de cada etapa (formal.rs, surface.rs, elab.rs, typed.rs, modules.rs, derive.rs, residual/, experiments.rs, runtime.rs).
          - El launcher y el runner acotado como punto de entrada.
          - Lo que cada etapa puede rechazar, con un mensaje de error real por etapa.
        excludes:
          - El detalle de la gramática (s3.2), los detalles internos del análisis sintáctico (s3.4), la elaboración y el tipado (Parte 4), los algoritmos de evaluación (s6.5).
        evidence: [src/formal.rs, src/surface.rs, src/elab.rs, src/typed.rs, src/modules.rs, src/derive.rs, src/bin/residuum.rs, residuum, scripts/test_safe.py]
        listings:
          - {kind: query, what: "un módulo trazado de principio a fin"}
          - {kind: expect-error, what: "un rechazo de cada etapa - análisis sintáctico, elaboración y evaluación"}
        words: 1200

      - id: s1.5
        title: La posición de Residuum en el panorama de los lenguajes de programación
        model: Haskell 1.4
        purpose: ¿Dónde se sitúa Residuum respecto de los lenguajes que el lector ya conoce?
        covers:
          - Datalog y Prolog (reglas de Horn, evaluación hacia delante frente a hacia atrás).
          - Programación con conjuntos de respuestas y lógica de defaults (razonamiento no monotónico).
          - Lógicas lineales y residuadas (el conectivo -o).
          - Catala y HAnSKELLsen como vecinos del dominio jurídico; Residuum como lenguaje de propósito general.
        excludes:
          - La evaluación detallada según los criterios (Parte 2); la semántica formal (Parte 6).
        evidence: [docs/four-model-entailment.md, docs/evidence-pair-models.md, docs/program-defaults.md, "README.md (Comparación experimental de defaults con Catala)"]
        listings: []
        words: 900

      - id: s1.7
        title: Un recorrido guiado por un programa
        model: none (added 2026-11-19 after an external review; placed before s1.6 so the reader meets a program before the criteria)
        purpose: ¿Cómo se escribe, se ejecuta y se lee un primer programa de Residuum?
        covers:
          - "Un módulo pequeño escrito paso a paso: entidades, constantes, verbos, una regla y un experimento."
          - "Ejecutarlo con run y leer la salida: seeds, Known y el objetivo."
          - "Preguntar qué falta con una consulta residual y leer el requisito."
          - "Ver por qué con explain."
          - "Qué mirar en un programa ajeno, y adónde ir después en el libro."
        excludes:
          - "Las etapas del pipeline (s1.4)."
          - "La semántica formal (Parte 6) y el trazado completo (s6.13)."
          - "Defaults, FOUR y efectos: sólo una mención y su referencia."
        evidence: [docs/language-reference.md, examples/experiments/residual_proof.res, README.md]
        listings:
          - {kind: run, what: "el módulo del recorrido"}
          - {kind: query, what: "la consulta residual sobre el mismo módulo"}
          - {kind: explain, what: "la justificación del objetivo"}
        words: 1000

      - id: s1.6
        title: Criterios para evaluar lenguajes de programación
        model: HAnSKELLsen PL 1.4; Catala 1.4
        purpose: ¿Qué criterios aplica la Parte 2, y por qué estos?
        covers:
          - Los doce criterios en el orden fijo de la serie, una oración para cada uno.
          - Por qué los criterios hacen que la evaluación sea sistemática y comparable a lo largo de la serie.
        excludes:
          - Cualquier evaluación de Residuum (Parte 2).
        evidence: ["series:~/hanskellsen_docs/books/programming-language/txt/01_introduction_and_background/04_1_4_criteria_for_evaluating_programming_languages.txt"]
        listings: []
        words: 400

  - id: p2
    title: Criterios para evaluar lenguajes de programación
    note: >
      Every section follows the series pattern: generic definition; what the
      criterion means for Residuum; numbered listings with at least one contrast
      language; a closing verdict sentence ("Under this criterion, Residuum
      performs ..."). Mechanisms are owned by Parts 3-7; here they are evaluated,
      not explained.
    sections:
      - id: s2.1
        title: Expresividad
        model: HAnSKELLsen PL 2.1
        purpose: ¿Qué puede decirse directamente en Residuum, y qué necesita una codificación?
        covers: [eventos tipados con tiempo, conjunción, unidad, negación evidencial, cláusulas residuales, Programs, defaults, efectos, "lo que no tiene forma directa (disyunción, cuantificadores más allá de los parámetros de regla, aritmética)"]
        excludes: [detalles de sintaxis (Parte 3), semántica (Parte 6)]
        evidence: [docs/language-reference.md, docs/peano-after-experiment.md, docs/temporal-constructors-experiment.md]
        listings: [{kind: run, what: "un conjunto de reglas expresado en Residuum y el mismo en Prolog como contraste"}]
        verdict: required
        words: 900

      - id: s2.2
        title: Buena definición
        model: HAnSKELLsen PL 2.2 (four subsections)
        purpose: ¿Tiene cada programa aceptado exactamente un significado?
        subsections:
          - {title: Determinación sintáctica y estática, covers: [gramática no ambigua, la elaboración rechaza los programas mal tipados, símbolos duplicados]}
          - {title: Previsibilidad de la evaluación, covers: [cierre independiente del orden de las reglas, sellos deterministas salvo diferencias documentadas]}
          - {title: Significado de superficie y significado de bajo nivel, covers: [lo que TypedAST hace explícito y la superficie oculta - sustituciones canónicas, parámetros higiénicos de Program]}
          - {title: Conflicto y completitud, covers: [conflictos entre defaults, incompletitud de Horn respecto de FOUR, rechazos en lugar de respuestas parciales]}
        excludes: [la semántica misma (Parte 6)]
        evidence: [docs/monotonic-core-final-audit.md, docs/canonical-typed-substitutions.md, docs/program-consistency-contract.md, docs/four-model-entailment.md]
        listings: [{kind: expect-error, what: "un programa ambiguo o mal tipado, rechazado"}, {kind: run, what: "orden de las reglas permutado, mismo cierre"}]
        verdict: required
        words: 1600

      - id: s2.3
        title: Tipos y estructuras de datos
        model: HAnSKELLsen PL 2.3
        purpose: ¿Hasta qué punto se ajustan los tipos de Residuum a los datos sobre los que razonan sus programas?
        covers: [entidades, campos, Set, opcional, records, PropositionTime, la ausencia de números y de cadenas como tipos predefinidos]
        excludes: [las reglas del sistema de tipos (Parte 4)]
        evidence: [docs/language-reference.md, src/typed.rs]
        listings: [{kind: run, what: "una entidad con campos y un valor record usados en una regla"}]
        verdict: required
        words: 800

      - id: s2.4
        title: Modularidad
        model: HAnSKELLsen PL 2.4
        purpose: ¿Cómo se dividen y se reutilizan los programas Residuum más grandes?
        covers: [módulos e imports, Programs y RuleUses, la aplicación parcial como reutilización, ámbitos explícitos de consulta]
        excludes: [cómo se compilan los Programs (s5.6)]
        evidence: [src/modules.rs, docs/minimal-programs.md, docs/owns-reuse-experiment.md, docs/owns-interface-experiment.md]
        listings: [{kind: query, what: "un Program reutilizado con dos bindings"}]
        verdict: required
        words: 900

      - id: s2.5
        title: Entrada y salida
        model: HAnSKELLsen PL 2.5; Catala 2.5
        purpose: ¿Cómo entran los hechos y cómo salen las respuestas?
        covers: [seeds y premises como entrada, experimentos en el fichero fuente, "presentaciones de la CLI (run, query, explain, execute)", trazabilidad de las respuestas]
        excludes: [la mecánica de ejecución de efectos (s7.4)]
        evidence: [docs/executable-fixtures.md, docs/stepwise-evaluation.md, src/experiments.rs]
        listings: [{kind: explain, what: "las justificaciones impresas para un evento derivado"}]
        verdict: required
        words: 800

      - id: s2.6
        title: Portabilidad y estandarización
        model: HAnSKELLsen PL 2.6
        purpose: ¿Dónde se ejecuta Residuum y qué lo define?
        covers: [implementación en Rust, Rust 1.87 como mínimo, la exigencia de Linux/cgroup v2 del runner, ningún estándar externo - la implementación y sus tests son la definición, la etiqueta congelada v1]
        excludes: [los detalles internos del runner (s7.2)]
        evidence: [Cargo.toml, .github/workflows/ci.yml, docs/v1-scope.md, README.md]
        listings: []
        verdict: required
        words: 600

      - id: s2.7
        title: Eficiencia y rendimiento
        model: HAnSKELLsen PL 2.7
        purpose: ¿Es Residuum lo bastante rápido, y es previsible su coste?
        covers: ["resumen de los costes medidos y de las aceleraciones de 2026-11, con una referencia a s7.6 para las cifras"]
        excludes: [las mediciones y el método (s7.6), algoritmos (s6.5)]
        evidence: [docs/semi-naive-pending-optimizations.md, docs/compile-cost-optimizations.md]
        listings: []
        verdict: required
        words: 600

      - id: s2.8
        title: Pedagogía y facilidad de aprendizaje
        model: HAnSKELLsen PL 2.8
        purpose: ¿Cuánto cuesta aprender Residuum, y para quién?
        covers: [la dirección de lectura A <= C como escollo, pocas construcciones, el flujo de trabajo con ejemplos en el fichero, la referencia del lenguaje]
        excludes: [la legibilidad de los programas (s2.11)]
        evidence: [docs/language-reference.md, docs/executable-fixtures.md]
        listings: [{kind: run, what: "el ejemplo de la dirección de lectura"}]
        verdict: required
        words: 700

      - id: s2.9
        title: Generalidad
        model: HAnSKELLsen PL 2.9
        purpose: ¿Es Residuum un lenguaje de propósito general, y dónde termina eso?
        covers: [programas no jurídicos - aritmética de Peano y productos de polinomios, programas jurídicos, "lo que no está demostrado (computabilidad general) y lo que la ejecución restringe (recursión en la CLI, límites del runner, búsqueda no acotada)"]
        excludes: [el modelado jurídico en profundidad (s8.2)]
        evidence: [docs/peano-after-experiment.md, docs/peano-multiplication-and-polynomial-boundary.md, docs/peano-polynomial-product-experiment.md, docs/legal-monotonic-v1.md]
        listings: [{kind: include, what: "una fixture de aritmética de Peano"}]
        verdict: required
        words: 800

      - id: s2.10
        title: Capacidad de modelado
        model: Catala 2.10 (subsections), adapted
        purpose: ¿Hasta qué punto puede escribirse directamente el razonamiento de un dominio?
        subsections:
          - {title: Reglas monotónicas, covers: [consecuencias que nunca se retractan]}
          - {title: Requisitos residuales, covers: [lo que todavía se necesita como respuesta de primera clase]}
          - {title: Defaults y excepciones, covers: [anulación no monotónica]}
          - {title: Programs y activación, covers: [comportamiento asociado a eventos]}
        excludes: [mecanismos (Partes 5-6), "el caso de estudio jurídico (s8.2, Apéndice B)"]
        evidence: [docs/legal-abduction-harness.md, docs/program-defaults.md, docs/active-verb-programs.md]
        listings: [{kind: query, what: "un requisito residual"}, {kind: run, what: "un default bloqueado por una excepción"}]
        verdict: required
        words: 1400

      - id: s2.11
        title: Legibilidad
        model: HAnSKELLsen PL 2.11
        purpose: ¿Puede un lector entender un programa Residuum sin ejecutarlo?
        covers: [disposición con las declaraciones primero, tiempos explícitos, cabeceras de regla largas en las fixtures jurídicas, comentarios]
        excludes: [la facilidad de aprendizaje (s2.8)]
        evidence: [examples/legal/case_monotonic_formal.res, docs/language-reference.md]
        listings: [{kind: include, what: "un extracto de una fixture jurídica"}]
        verdict: required
        words: 700

      - id: s2.12
        title: Claridad semántica
        model: Catala 2.12 (subsections), adapted
        purpose: ¿Está claro lo que significa un programa, en cada capa?
        subsections:
          - {title: Semántica del cierre, covers: [el menor cierre]}
          - {title: Semántica residual, covers: [requisitos y certificación]}
          - {title: Selección de defaults, covers: [bloqueado, derrotado, seleccionado]}
          - {title: Comparación en teoría de modelos, covers: [Horn frente a FOUR]}
        excludes: [las definiciones formales (Parte 6)]
        evidence: [docs/monotonic-core-specification.md, docs/theory-model-bridge.md, docs/four-model-entailment.md]
        listings: [{kind: query, what: "Horn falso y FOUR verdadero sobre el mismo objetivo"}]
        verdict: required
        words: 1200

  - id: p3
    title: Sintaxis y estructura formal
    sections:
      - id: s3.1
        title: La sintaxis como decisión de diseño del lenguaje
        model: Haskell 3.1; Catala 3.1
        purpose: ¿Por qué la superficie de Residuum tiene el aspecto que tiene?
        covers: [palabras clave de declaración, "@ para el tiempo", "<= y -o como conectivos", la alternativa CNL pausada]
        excludes: [la gramática (s3.2)]
        evidence: [docs/language-reference.md, src/cnl.rs]
        listings: []
        words: 600
      - id: s3.2
        title: Gramáticas y especificación formal
        model: Haskell 3.2-3.3 (merged with BNF/EBNF)
        purpose: ¿Cuál es, con precisión, la gramática de Formal?
        covers: ["una EBNF de todo el lenguaje de superficie derivada de src/formal.rs, incluida la restricción del tiempo de evento (@ name | @ after name)"]
        excludes: [la implementación del parser (s3.4)]
        evidence: [src/formal.rs, src/surface.rs, docs/language-reference.md]
        listings: [{kind: include, what: "la EBNF, generada o comprobada contra el parser"}]
        words: 1400
      - id: s3.3
        title: Estructura léxica, comentarios y espacios en blanco
        model: Haskell 3.5 (Layout Rule), adapted
        purpose: ¿Cuáles son los tokens, y importa la disposición del texto?
        covers: [tokens, identificadores, comentarios, espacios en blanco no significativos, comas finales]
        excludes: [la gramática (s3.2)]
        evidence: [src/formal.rs]
        listings: [{kind: run, what: "el mismo módulo con dos formatos distintos"}]
        words: 500
      - id: s3.4
        title: Parsing y análisis sintáctico
